<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup page</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">

</head>
<body class="bg-gray-100 font-sans antialiased">
        <!---nav bar-->
    <nav class="bg-blue-600 p-4 text-white flex justify-between">
    <div>
<h1 class ="text-3xl font-bold">

    AI BLOG GENERATOR
</h1>
    </div>
    <div>
<a href="#" class="text-white hover:underline">Login</a>
    
<a href="#" class="text-white hover:underline">signup</a>
</div>
    </nav>

    <!-- main coontent -->
     <div class="flex items-center justify-center h-screen">
        <div class="bg-white p-8 shadow-md rounded-lg max-w-md w-full">

<!-- login form -->

<form class="space-y-4">

    <h2 class="text-xl font-semibold">Signup</h2>

    <div>
        <label for="username" class="block mb-1 font-medium">username</label>

        <input type="text" id="username" placeholder="enter username..." class="w-full p-2 border rounded">
    </div>
        <div>
        <label for="email" class="block mb-1 font-medium">email</label>

        <input type="email" id="email" placeholder="enter email..." class="w-full p-2 border rounded">
    </div>

        <div>
        <label for="password" class="block mb-1 font-medium">password</label>

        <input type="password" id="password" placeholder="enter password..." class="w-full p-2 border rounded">
    </div>
            <div>
        <label for="repeatpassword" class="block mb-1 font-medium">Repeat password</label>

        <input type="password" id="repeatpassword" placeholder="enter password again..." class="w-full p-2 border rounded">
    </div>
    <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">
        Signup
    </button>
</form>

        </div>
     </div>
</body>
</html>
